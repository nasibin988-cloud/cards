# Cards on the Hetzner VPS.
#
# Joins the existing rebuilding-iran Caddy network (`app_web`, created by
# /opt/app/docker-compose.yml when the RI stack starts) so Caddy can
# reverse-proxy `rebuilding-iran.com/cards*` to this container.
#
# Self-hosted sync:
#   - The /api/sync/snapshot route reads/writes a single JSON file from
#     /data inside the container.
#   - On the host, /opt/cards/data is bind-mounted there so the snapshot
#     survives container rebuilds.
#   - CARDS_SYNC_TOKEN is the bearer token clients must send. Set it in
#     a sibling .env file (see .env.example) so it stays out of git.

services:
  cards:
    build:
      context: .
      args:
        BASE_PATH: /cards
        # Optional: bake an OpenAI key into the client bundle so users
        # don't have to paste it into Settings per-device. Read from the
        # sibling .env file (`OPENAI_API_KEY=sk-…`); blank if absent.
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    image: cards:latest
    container_name: cards
    restart: unless-stopped
    # No public port mapping — Caddy reaches it via the shared network.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_BASE_PATH: /cards
      CARDS_SYNC_TOKEN: ${CARDS_SYNC_TOKEN:-}
      CARDS_SYNC_DATA_DIR: /data
    volumes:
      - /opt/cards/data:/data
    networks:
      - web

networks:
  web:
    external: true
    name: app_web
